name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    uses: tanzhongyan-org/.github/.github/workflows/codeql.yml@f9ce8a7ca64217ae1b0cbacd39fe741137728f1c # v1
    with:
      runtime: python
      language: python
      build-mode: none

name: DAST

on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dast:
    uses: tanzhongyan-org/.github/.github/workflows/dast.yml@33bb193f8f32e5b3f715c9e1dff6e36667d8e70d # v1
    with:
      runtime: python
      tool: schemathesis
      postgres-db: template_python
      database-url: postgresql+asyncpg://postgres:password@localhost:5432/template_python
      base-url: http://localhost:8000
      health-url: http://localhost:8000/api/v1/health
      install-command: uv sync --locked --no-dev
      db-setup-command: make db-migrate
      start-command: uv run uvicorn app.main:app --port 8000

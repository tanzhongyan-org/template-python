name: Initialize Template Repository

on:
  workflow_dispatch:

jobs:
  init-repo:
    # Only run on repositories created from the template, not on the template itself
    if: github.repository != 'tanzhongyan-org/template-python'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Rename template placeholders
        run: |
          NEW_NAME="${GITHUB_REPOSITORY#*/}"
          NEW_NAME_UNDERSCORE="${NEW_NAME//-/_}"
          echo "Renaming template-python to $NEW_NAME (package: $NEW_NAME_UNDERSCORE)..."
          find . -type f \( -name "*.toml" -o -name "*.py" -o -name "*.md" -o -name "*.jsonc" -o -name "*.yml" \) \
            -not -path "*/.git/*" \
            -not -path "*/.github/*" \
            -exec sed -i "s/template-python/$NEW_NAME/g" {} +
          find . -type f \( -name "*.toml" -o -name "*.py" \) \
            -not -path "*/.git/*" \
            -not -path "*/.github/*" \
            -exec sed -i "s/template_python/$NEW_NAME_UNDERSCORE/g" {} +

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: initialize repository from template-python"
          git push

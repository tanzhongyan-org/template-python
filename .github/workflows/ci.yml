name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verification-gates:
    if: (!hashFiles('.github/workflows/init.yml') || github.repository == 'tanzhongyan-org/template-python')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: template_python
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1edb52594c857e2b5b13128931090f0640537287 # v5.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Run database migrations
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:password@localhost:5432/template_python"

      - name: "Run Verification Gates"
        run: make check
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:password@localhost:5432/template_python"

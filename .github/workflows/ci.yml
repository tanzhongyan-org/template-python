name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verification-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: "Run Verification Gates"
        run: make check

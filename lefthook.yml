pre-commit:
  parallel: false
  commands:
    format-lint:
      glob: "*.py"
      run: uv run ruff check --fix {staged_files} && uv run ruff format {staged_files}
      stage_fixed: true

    ast-grep-stubs:
      run: npx --yes --package @ast-grep/cli@0.51.0 ast-grep scan

    ai-slop-regex:
      run: "! git diff --staged -U0 -- ':(exclude)*.md' | rg -i '\\b(as an ai language model|here is the (rest of the )?code|i hope this helps)\\b'"

commit-msg:
  commands:
    forbid-ai-trailers:
      run: "! rg -i 'co-authored-by:.*(claude|copilot|assistant|gpt)' {1}"

pre-push:
  parallel: false
  commands:
    typecheck:
      run: uv run mypy src
    unit-tests:
      run: uv run pytest

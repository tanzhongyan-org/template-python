services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: template_python
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 stores data under a versioned subdirectory; the image
      # refuses to start when the old /var/lib/postgresql/data path is mounted.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d template_python"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
